[package]
name = "r2h-pdf"
version = "2.1.0"
description = "R2H PDF — desktop PDF workstation for legal and engineering document review"
authors = ["R2H Team"]
edition = "2021"
exclude = ["target2/", "target-test/"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "r2h_pdf_lib"
crate-type = ["rlib"]

[[bin]]
name = "r2h-documentengine-host"
path = "src/bin/r2h-documentengine-host.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
mupdf = { path = "../vendor/mupdf-0.6.0", default-features = false }
regex = "1.11"
crc32fast = "1.4"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
once_cell = "1"
sha2 = "0.10"
ed25519-dalek = "2.2.0"

[dev-dependencies]
proptest = "1.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
